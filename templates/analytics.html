<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Analytics — Spendly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .analytics-section {
            background: var(--paper-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            margin: 2rem auto;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .analytics-icon {
            width: 80px;
            height: 80px;
            background: var(--ink);
            border-radius: 16px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
        }

        .coming-soon-badge {
            background: var(--paper-warm);
            color: var(--ink);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .analytics-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--ink);
            margin-bottom: 1.5rem;
        }

        .analytics-description {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--ink-soft);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .analytics-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin: 2rem 0;
        }

        .analytics-dot {
            width: 12px;
            height: 12px;
            background: var(--border-soft);
            border-radius: 50%;
        }

        .analytics-subtitle {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--ink-muted);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <section class="analytics-section">
        <div class="analytics-icon">
            <span>⏰</span>
        </div>

        <div class="coming-soon-badge">Coming Soon</div>

        <h1 class="analytics-title">Advanced Analytics</h1>

        <p class="analytics-description">
            We're working on powerful insights and visualizations to help you understand your spending patterns better.
        </p>

        <div class="analytics-dots">
            <div class="analytics-dot"></div>
            <div class="analytics-dot"></div>
            <div class="analytics-dot"></div>
        </div>

        <p class="analytics-subtitle">We're crafting something special</p>
    </section>
</body>
</html>
